<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1070" />
  <title>Add expense · Bill Splitting Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="app sketch">
  <p class="loading" id="loading">Loading…</p>
  <form id="expense-form" class="hidden" novalidate>
    <h1 class="page-title"><a class="back" id="back" href="dashboard.html" aria-label="Go back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a><span id="page-title">Add Expense</span></h1>
    <div class="field"><label for="name">Expense name</label>
      <div class="white-input"><input id="name" maxlength="100" placeholder="Dinner at Restaurant" /><svg class="pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></div></div>
    <div class="inline"><label for="amount">Total amount</label>
      <div class="white-input"><input id="amount" inputmode="decimal" autocomplete="off" placeholder="₦0.00" class="no-icon" /></div></div>
    <p>Split equally among</p>
    <div class="checks" id="people"></div>
    <div class="addperson"><span class="plus" aria-hidden="true">+</span>
      <input id="newperson" placeholder="+ Add person" maxlength="60" aria-label="Add a person by name" /><button type="button" id="addbtn">Add</button></div>
    <hr class="rule" />
    <div class="calc" id="calc" aria-live="polite"></div>
    <div class="note-box">* Equal split only • All members split equally</div>
    <div class="error" id="err" role="alert"></div>
    <button class="btn" type="submit" id="save">Save Expense</button>
  </form>
</main>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/pages/add-expense.js"></script>
</body>
</html>
