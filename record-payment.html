<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1070" />
  <title>Record payment · Bill Splitting Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="app sketch">
  <p class="loading" id="loading">Loading…</p>
  <form id="payment-form" class="hidden" novalidate>
    <h1 class="page-title modal"><span>Record Payment</span><a class="back" id="close" href="dashboard.html" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M18 6L6 18M6 6l12 12"/></svg></a></h1>
    <p class="center-text">Mark payment between members</p>
    <div class="field"><label for="from">Payer (who paid)</label><div class="white-input"><select id="from"></select></div></div>
    <div class="field"><label for="to">To (recipient)</label><div class="white-input"><select id="to"></select></div></div>
    <div class="field"><label for="amount">Amount</label><div class="white-input"><input id="amount" inputmode="decimal" autocomplete="off" placeholder="₦0.00" class="no-icon" /></div></div>
    <div class="field"><label for="date">Date</label><div class="white-input"><input id="date" type="date" /></div></div>
    <p>Payment method</p>
    <div class="radios" role="radiogroup" aria-label="Payment method">
      <label class="radio"><input type="radio" name="method" value="Cash" checked /><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M20 6L9 17l-5-5"/></svg></span>Cash</label>
      <label class="radio"><input type="radio" name="method" value="Bank transfer" /><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M20 6L9 17l-5-5"/></svg></span>Bank transfer</label>
      <label class="radio"><input type="radio" name="method" value="Other" /><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M20 6L9 17l-5-5"/></svg></span>Other</label>
    </div>
    <div class="field"><label for="note">Note (optional)</label><div class="white-input"><input id="note" maxlength="140" placeholder="e.g. Paid for dinner split" class="no-icon" /></div></div>
    <div class="error" id="err" role="alert"></div>
    <button class="btn" type="submit" id="save">Confirm payment</button>
    <p class="foot">* Updates balances and settles the oldest unpaid expenses first *</p>
    <p class="foot">* Payments are recorded to history *</p>
  </form>
</main>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/pages/record-payment.js"></script>
</body>
</html>
