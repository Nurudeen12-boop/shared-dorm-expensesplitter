<main class="app gradient-soft center">

        <path d="M18 22h24M18 32h24M18 42h16" stroke="#9d93c9" stroke-width="3" stroke-linecap="round"/>
        <rect x="40" y="34" width="38" height="50" rx="6" fill="#c9d4f5"/>
        <rect x="46" y="40" width="26" height="10" rx="2" fill="#fff"/>

    <div class="steps">
      <div class="step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="1.6"><path d="M6 3h12v18l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5V3z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><div><b><span class="num">1</span>Add your bill</b><span class="d">Enter the total amount</span></div></div>
      <div class="step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="1.6"><circle cx="12" cy="7" r="3"/><circle cx="5" cy="9" r="2.3"/><circle cx="19" cy="9" r="2.3"/><path d="M6 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5M1 18c0-2.5 1.7-4 4-4M23 18c0-2.5-1.7-4-4-4"/></svg><div><b><span class="num">2</span>Add people</b><span class="d">Add friends to split with</span></div></div>
