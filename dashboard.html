<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1070" />
  <title>Dashboard · Bill Splitting Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="app">
  <p class="loading" id="loading">Loading…</p>
  <div id="content" class="hidden">
    <header class="topbar">
      <button class="icon-btn" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1>Dashboard</h1>
      <button class="icon-btn" id="invite" aria-label="Invite roommates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    </header>

    <section class="card balance" aria-label="Total balance">
      <div class="label">Total Balance</div>
      <div class="amount" id="bal-amount">₦0.00</div>
      <div class="caption" id="bal-caption"></div>
      <div class="actions">
        <a class="btn small" href="add-expense.html">+ Add expense</a>
        <a class="btn small" href="record-payment.html">Record payment</a>
      </div>
    </section>

    <section class="card" aria-label="Who owes whom">
      <h2>Who owes whom</h2>
      <div id="pairs"></div>
      <div class="linkrow"><button class="link small" id="toggle" type="button">Show everyone</button></div>
    </section>

    <section class="card" aria-label="Recent expenses">
      <h2>Recent expenses</h2>
      <div id="recent"></div>
      <div class="linkrow"><a class="link small hidden" id="all" href="history.html">View all</a></div>
    </section>

    <p class="footnote" id="footnote"></p>
  </div>
</main>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
