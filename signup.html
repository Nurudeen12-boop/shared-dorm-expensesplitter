<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1070" />
  <title>Create account · Bill Splitting Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="app">
  <form class="auth center" id="signup-form" novalidate>
    <h1 class="title">Create Account</h1>
    <p class="subtitle bold">Bill Splitting Calculator</p>
    <div class="divider">Join to start splitting bills</div>
    <div class="field"><label for="name">Full name</label>
      <div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><input id="name" autocomplete="name" placeholder="Jane Doe" maxlength="100" required /></div></div>
    <div class="field"><label for="email">Email</label>
      <div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input id="email" type="email" autocomplete="email" placeholder="jane@example.com" required /></div></div>
    <div class="field"><label for="pw">Password</label>
      <div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required />
        <button type="button" class="eye" data-eye="pw" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <div class="field"><label for="pw2">Confirm password</label>
      <div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password" required />
        <button type="button" class="eye" data-eye="pw2" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <p class="hint">Password must be at least 8 characters</p>
    <div class="error" id="err" role="alert"></div>
    <button class="btn" type="submit" id="submit">Create account</button>
    <p>Already have an account? <a class="link" href="login.html">Login</a></p>
    <p class="hint">By creating an account you agree to Terms &amp; Privacy</p>
  </form>
</main>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/pages/signup.js"></script>
</body>
</html>
